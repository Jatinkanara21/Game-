<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sunset Street Racer — Ultra 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05070d;font-family:Arial,sans-serif;color:#fff}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 8px #000}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;font-weight:900;letter-spacing:1px}.badge{background:#0008;border:1px solid #fff3;padding:7px 11px;border-radius:999px}.mission{position:absolute;left:16px;top:58px;padding:10px 14px;background:#05070dcc;border:1px solid #fff2;border-left:4px solid #fff;border-radius:0 10px 10px 0}.mission small{opacity:.72}.heat{position:absolute;right:18px;top:58px;font-weight:900}.stars{letter-spacing:3px}.speed{position:absolute;left:18px;bottom:18px;font-size:38px;font-weight:900}.speed small{font-size:11px;opacity:.65}.stats{position:absolute;left:50%;top:57px;transform:translateX(-50%);background:#0007;padding:7px 12px;border-radius:20px;font-size:12px}.mini{position:absolute;right:18px;bottom:18px;width:150px;height:105px;border:1px solid #fff6;border-radius:10px;background:#05070dcc}.controls{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px;gap:8px;pointer-events:auto}.btn{border:1px solid #fff5;background:#ffffff1c;color:#fff;border-radius:17px;font-size:20px;font-weight:900;backdrop-filter:blur(8px);touch-action:none}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.gas{grid-column:2;grid-row:1}.brake{grid-column:2;grid-row:2}.drift{grid-column:1;grid-row:1}.hint{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);font-size:11px;opacity:.55;white-space:nowrap}.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;font-size:38px;font-weight:1000;opacity:0}.banner.show{animation:pop 2.8s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,-35%) scale(.8)}15%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) scale(1.08)}}
@media(max-width:700px){.top{font-size:12px}.mission{font-size:12px}.stats{top:102px}.hint{display:none}.speed{font-size:31px}.mini{width:120px;height:84px}.controls{right:10px;bottom:10px;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px}.btn{font-size:18px}}
</style>
</head>
<body><div id="game"></div><div id="hud">
<div class="top"><div>⚡ SUNSET STREET RACER <span style="opacity:.55">ULTRA 3D</span></div><div id="status" class="badge">ESCAPE THE CITY</div></div>
<div class="mission"><b>ROOFTOP RUN</b><br><small id="missionText">Reach the rooftop garage • Drift to build heat</small></div>
<div class="stats"><span id="dist">0.00</span> KM&nbsp; • &nbsp;<span id="fps">60</span> FPS</div>
<div class="heat">HEAT <span class="stars" id="stars">★☆☆☆☆</span></div>
<div class="speed"><span id="spd">0</span> <small>KM/H</small></div>
<canvas class="mini" id="map" width="150" height="105"></canvas>
<div class="controls"><button class="btn drift" id="drift">DR</button><button class="btn gas" id="gas">▲</button><button class="btn left" id="left">◀</button><button class="btn brake" id="brake">▼</button><button class="btn right" id="right">▶</button></div>
<div class="hint">W/↑ GAS • S/↓ BRAKE • A/D STEER • SPACE DRIFT • R RESET</div>
<div class="banner" id="banner">ROOFTOP REACHED<br><small style="font-size:15px">CITY ESCAPE COMPLETE</small></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {EffectComposer} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/EffectComposer.js';
import {RenderPass} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const root=document.getElementById('game'),scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x553f52,.0027);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.05,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.65,.7,.78);composer.addPass(bloom);

function mat(color,rough=.7,metal=0,em=0,ei=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,emissive:em,emissiveIntensity:ei})}
const world=new THREE.Group();scene.add(world);
const hemi=new THREE.HemisphereLight(0xffd7bd,0x101927,2.2);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xff9b68,4.5);sun.position.set(-100,130,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);
const moon=new THREE.DirectionalLight(0x7394ff,0);moon.position.set(90,100,-120);scene.add(moon);

// Procedural asphalt texture: no external game assets required.
function asphaltTexture(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#25282d';g.fillRect(0,0,512,512);for(let i=0;i<13000;i++){const v=25+Math.random()*45;g.fillStyle=`rgb(${v},${v},${v+2})`;const s=Math.random()*2.2;g.fillRect(Math.random()*512,Math.random()*512,s,s)}for(let i=0;i<90;i++){g.strokeStyle='rgba(255,255,255,.035)';g.lineWidth=1;g.beginPath();g.moveTo(Math.random()*512,Math.random()*512);g.lineTo(Math.random()*512,Math.random()*512);g.stroke()}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(10,80);t.colorSpace=THREE.SRGBColorSpace;return t}
const roadMat=new THREE.MeshStandardMaterial({map:asphaltTexture(),roughness:.9,metalness:.05});
function box(w,h,d,ma,x,y,z,group=world){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;group.add(q);return q}

// Road, sidewalks and curbs
box(44,.25,820,roadMat,0,.1,20);box(4,.35,820,mat(0x555b62,.85),-24,.25,20);box(4,.35,820,mat(0x555b62,.85),24,.25,20);
for(let z=-390;z<430;z+=12)for(const lane of[-11,0,11])box(.18,.035,6,mat(0xf2eee0,.45),lane,.255,z);
for(let z=-390;z<430;z+=8){box(.45,.12,4,mat(z%16?0x2e3135:0xe9e5d8,.6),-26.1,.46,z);box(.45,.12,4,mat(z%16?0x2e3135:0xe9e5d8,.6),26.1,.46,z)}

// High-density city blocks with emissive windows and rooftop details.
const buildingPalette=[0x171d27,0x222936,0x30333b,0x3a3039,0x242f38,0x40343b];
function building(side,z,j){const w=5+Math.random()*6,h=12+Math.random()*42,d=12+Math.random()*8,x=side*(29+j*7);const b=box(w,h,d,mat(buildingPalette[(j+Math.abs(z/20))|0%buildingPalette.length],.88,.08),x,h/2,z+j*2-2);const rows=Math.floor(h/3.2);for(let r=0;r<rows;r++)for(let col=0;col<Math.floor(w/1.8);col++){if(Math.random()<.22)continue;const wm=mat(Math.random()<.78?0xffc56b:0x75b8ff,.25,.05,Math.random()<.78?0xff9d38:0x367cff,2.5);const wx=x-w/2+1+col*1.8;const wz=z+j*2-d/2-.04;box(.72,1.05,.06,wm,wx,3+r*3.2,wz)}for(let k=0;k<3;k++){const ac=mat(k===0?0x10151b:0x363b43,.7,.25);box(w*.45,.15,d*.25,ac,x+(Math.random()-.5)*2,h+.12,z+j*2-2)}return b}
for(let i=-20;i<=20;i++)for(const side of[-1,1])for(let j=0;j<3;j++)building(side,i*20,j);

// Street lamps with glowing bulbs.
const glowMat=new THREE.MeshStandardMaterial({color:0xffd18b,emissive:0xff9b38,emissiveIntensity:12});
for(let z=-370;z<420;z+=32)for(const side of[-1,1]){box(.16,8,.16,mat(0x11151a,.45,.7),side*27,4,z);box(1.5,.16,.8,mat(0x1a1d22,.5,.5),side*27,8,z);box(.65,.18,.45,glowMat,side*27,7.8,z);const p=new THREE.PointLight(0xffb25d,4,16);p.position.set(side*27,7.6,z);world.add(p)}

// Sunset sky sphere and sun.
const skyGeo=new THREE.SphereGeometry(600,32,16);const skyMat=new THREE.MeshBasicMaterial({color:0x8d4e5e,side:THREE.BackSide});const sky=new THREE.Mesh(skyGeo,skyMat);scene.add(sky);
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(20,32,16),new THREE.MeshBasicMaterial({color:0xffbd69}));sunDisc.position.set(-150,92,-300);scene.add(sunDisc);
for(let i=0;i<90;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.35+Math.random()*.8,6,6),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.45}));s.position.set((Math.random()-.5)*600,100+Math.random()*150,-300-Math.random()*300);scene.add(s)}

// Player supercar: layered body, glass, wheels, lights, exhaust.
const player=new THREE.Group();player.position.set(0,.75,22);scene.add(player);
const body= new THREE.Mesh(new THREE.BoxGeometry(3.9,.72,7.1),mat(0xdfe5ed,.2,.82));body.position.y=.72;body.castShadow=true;player.add(body);
const nose=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.85,3.2,16),mat(0xcbd2dc,.2,.78));nose.rotation.x=Math.PI/2;nose.scale.z=.72;nose.position.set(0,.88,-2.2);player.add(nose);
const rear=new THREE.Mesh(new THREE.BoxGeometry(3.5,.42,1.4),mat(0x15181d,.3,.7));rear.position.set(0,.62,3.25);player.add(rear);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.55,.82,2.65),new THREE.MeshPhysicalMaterial({color:0x07121d,metalness:.3,roughness:.05,transmission:.15,transparent:true,opacity:.92,clearcoat:1,clearcoatRoughness:.04}));cabin.position.set(0,1.43,.7);cabin.rotation.x=-.08;player.add(cabin);
const stripe=mat(0x11141a,.25,.8);box(0,0,0,stripe,0,0,0);const hoodStripe=new THREE.Mesh(new THREE.BoxGeometry(.22,.035,3.8),mat(0xeeeeee,.18,.7));hoodStripe.position.set(0,1.27,-1.05);player.add(hoodStripe);
for(const wx of[-1.7,1.7])for(const wz of[-2.35,2.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.54,.54,.36,32),mat(0x050608,.55,.65));w.rotation.z=Math.PI/2;w.position.set(wx,.48,wz);player.add(w);const rim=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.38,24),mat(0x9ca3ad,.25,.9));rim.rotation.z=Math.PI/2;rim.position.set(wx,.48,wz);player.add(rim)}
const headMat=mat(0xffffdf,.15,.15,0xffb44f,14);for(const wx of[-1.22,1.22]){const l=new THREE.Mesh(new THREE.BoxGeometry(.72,.24,.12),headMat);l.position.set(wx,1.02,-3.65);player.add(l)}
const tailMat=mat(0xff2020,.25,.2,0xff0000,8);for(const wx of[-1.25,1.25]){const l=new THREE.Mesh(new THREE.BoxGeometry(.7,.18,.12),tailMat);l.position.set(wx,.98,3.62);player.add(l)}
const exhaustMat=mat(0xff6b25,.2,.4,0xff4d00,9);for(const wx of[-.85,.85]){const e=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,.25,16),exhaustMat);e.rotation.x=Math.PI/2;e.position.set(wx,.55,3.65);player.add(e)}

// Traffic vehicles with varied body shapes and headlights.
const traffic=[];const trafficColors=[0x3e7dff,0xd53d42,0xf0c83d,0x36ad7a,0xa44fe0,0xe7e9ed,0xff7a35];
function makeTraffic(i){const g=new THREE.Group(),col=trafficColors[i%trafficColors.length];const b=new THREE.Mesh(new THREE.BoxGeometry(3.15,.72,5.65),mat(col,.3,.55));b.position.y=.7;b.castShadow=true;g.add(b);const cg=new THREE.Mesh(new THREE.BoxGeometry(2.35,.7,2.1),new THREE.MeshPhysicalMaterial({color:0x071522,roughness:.04,metalness:.35,clearcoat:1,transparent:true,opacity:.92}));cg.position.set(0,1.25,.25);g.add(cg);for(const wx of[-1.38,1.38])for(const wz of[-1.85,1.85]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.3,20),mat(0x08090b,.65,.5));w.rotation.z=Math.PI/2;w.position.set(wx,.48,wz);g.add(w)}const lm=mat(0xffffd6,.2,.1,0xffb14d,7);for(const wx of[-1.05,1.05]){const l=new THREE.Mesh(new THREE.BoxGeometry(.45,.16,.1),lm);l.position.set(wx,1.02,-2.85);g.add(l)}g.position.set([-11,0,11][i%3],.2,-35-i*42);world.add(g);traffic.push({g,lane:g.position.x,speed:42+(i%6)*9,hit:false,phase:i*.7})}
for(let i=0;i<24;i++)makeTraffic(i);

// Rooftop destination with helipad, lights and barrier.
const roof=box(44,.55,34,mat(0x61666d,.68,.15),0,.8,-330);roof.name='ROOFTOP';
for(let x=-18;x<=18;x+=6)box(4,.18,1,mat(0xf0eee2,.4),x,1.1,-330);for(let x=-18;x<=18;x+=6){box(.3,1.7,.3,tailMat,x,1.9,-315);box(2.8,.08,.08,glowMat,x,2.7,-315)}
const ring=new THREE.Mesh(new THREE.RingGeometry(7,7.3,48),new THREE.MeshBasicMaterial({color:0xff4b35,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(0,1.1,-330);world.add(ring);

// Drift smoke and sparks.
const particles=[];function particle(kind='smoke'){const color=kind==='spark'?0xffb34a:0xdce3e8;const s=new THREE.Mesh(new THREE.SphereGeometry(kind==='spark'?.06:.13+Math.random()*.22,8,8),new THREE.MeshBasicMaterial({color,transparent:true,opacity:kind==='spark'?.9:.35}));s.position.set(player.position.x+(Math.random()-.5)*2.3,.25,player.position.z+2.8+Math.random()*1.3);world.add(s);particles.push({s,life:1,kind})}

const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);for(const id of['left','right','gas','brake','drift']){const b=document.getElementById(id),k={left:'a',right:'d',gas:'w',brake:'s',drift:' '}[id];b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[k]=false}

let speed=0,steer=0,distance=0,heat=1,completed=false,last=performance.now(),fpsTimer=0,frames=0;
function reset(){player.position.set(0,.75,22);player.rotation.set(0,0,0);speed=steer=distance=0;heat=1;completed=false;document.getElementById('status').textContent='ESCAPE THE CITY';document.getElementById('missionText').textContent='Reach the rooftop garage • Drift to build heat';document.getElementById('banner').className='banner';traffic.forEach((q,i)=>{q.g.position.set([-11,0,11][i%3],.2,-35-i*42);q.lane=q.g.position.x;q.hit=false})}
function update(dt,now){const gas=keys.w||keys.arrowup,brake=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,drift=keys[' '];if(gas)speed+=105*dt;else speed-=20*dt;if(brake)speed-=145*dt;speed=THREE.MathUtils.clamp(speed,0,220);const target=(left?-1:0)+(right?1:0);steer=THREE.MathUtils.lerp(steer,target*2,dt*7);player.position.x=THREE.MathUtils.clamp(player.position.x+steer*dt*(speed/78),-18,18);player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-steer*.1,dt*8);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,steer*.025,dt*5);
if(drift&&Math.abs(steer)>.1&&speed>42){speed*=1-dt*.1;heat=Math.min(5,heat+dt*.28);particle();if(Math.random()<.4)particle('spark')}else heat=Math.max(1,heat-dt*.02);distance+=speed*dt*.0018;
for(const q of traffic){q.g.position.z+=(speed-q.speed)*dt*.43;q.g.rotation.y=Math.sin(now*.001+q.phase)*.015;if(q.g.position.z>55){q.g.position.z=-720-Math.random()*140;q.lane=[-11,0,11][Math.floor(Math.random()*3)];q.g.position.x=q.lane;q.speed=42+Math.random()*78;q.hit=false}if(Math.abs(q.g.position.z-player.position.z)<4.2&&Math.abs(q.g.position.x-player.position.x)<3.05&&!q.hit){q.hit=true;speed*=.22;heat=Math.min(5,heat+.75);for(let i=0;i<5;i++)particle('spark')}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt*(p.kind==='spark'?2.8:1.15);p.s.position.y+=dt*(p.kind==='spark'?.25:.7);p.s.scale.multiplyScalar(1+dt*(p.kind==='spark'?.2:1.4));p.s.material.opacity=Math.max(0,p.life*(p.kind==='spark'?.9:.35));if(p.life<=0){world.remove(p.s);particles.splice(i,1)}}
const cycle=(Math.sin(now*.000025)+1)/2;sun.intensity=4.5*(1-cycle*.72);moon.intensity=cycle*1.25;hemi.intensity=2.2-cycle*.9;const skyLight=new THREE.Color().setHSL(.98,.28,.37-cycle*.14);scene.fog.color.copy(skyLight);scene.background=skyLight;sunDisc.material.color.setHSL(.08,.75,.7-cycle*.2);
const desired=new THREE.Vector3(player.position.x*.38,5.3,player.position.z+13.5);camera.position.lerp(desired,dt*4.2);camera.lookAt(player.position.x*.2,1.05,player.position.z-9);
if(distance>=.52&&!completed){completed=true;document.getElementById('status').textContent='ROOFTOP REACHED';document.getElementById('missionText').textContent='Mission complete • Press R to replay';document.getElementById('banner').className='banner show'}}
function mini(){const c=document.getElementById('map').getContext('2d');c.clearRect(0,0,150,105);c.fillStyle='#070a10';c.fillRect(0,0,150,105);c.strokeStyle='#70757d';c.lineWidth=8;c.beginPath();c.moveTo(75,100);c.lineTo(75,70);c.lineTo(54,47);c.lineTo(94,25);c.lineTo(75,5);c.stroke();c.strokeStyle='#fff3';c.lineWidth=1;c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(75,98-Math.min(88,distance*160),4,0,7);c.fill();c.fillStyle='#ff493b';c.fillRect(70,5,10,4)}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt,now);composer.render();document.getElementById('spd').textContent=Math.round(speed);document.getElementById('dist').textContent=distance.toFixed(2);const h=Math.min(5,Math.ceil(heat));document.getElementById('stars').textContent='★'.repeat(h)+'☆'.repeat(5-h);frames++;fpsTimer+=dt;if(fpsTimer>1){document.getElementById('fps').textContent=frames;frames=0;fpsTimer=0}mini();requestAnimationFrame(loop)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});loop(performance.now());
</script></body></html>
