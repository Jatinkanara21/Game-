<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sunset Street Racer 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial;color:#fff}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:16px 20px;font-weight:900;text-shadow:0 3px 8px #000}.mission{position:absolute;left:18px;top:58px;background:#05070dcc;border-left:4px solid #fff;padding:10px 14px;border-radius:0 8px 8px 0}.mission small{opacity:.7}.speed{position:absolute;left:18px;bottom:18px;font-size:34px;font-weight:900;text-shadow:0 3px 8px #000}.speed small{font-size:12px;opacity:.7}.heat{position:absolute;right:18px;top:58px;font-weight:900}.mini{position:absolute;right:18px;bottom:18px;width:150px;height:105px;border:1px solid #fff8;border-radius:10px;background:#05070dcc}.stats{position:absolute;left:50%;top:58px;transform:translateX(-50%);font-size:12px;background:#0008;padding:7px 12px;border-radius:20px}.controls{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px;gap:8px;pointer-events:auto}.btn{border:1px solid #ffffff55;background:#ffffff20;color:#fff;border-radius:16px;font-size:20px;font-weight:900;touch-action:none}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.gas{grid-column:2;grid-row:1}.brake{grid-column:2;grid-row:2}.drift{grid-column:1;grid-row:1}.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:11px;opacity:.55;white-space:nowrap}.banner{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);font-size:34px;font-weight:1000;text-align:center;text-shadow:0 4px 15px #000;opacity:0}.banner.show{animation:pop 2.4s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) scale(1.08)}}</style></head><body><div id="game"></div><div id="hud"><div class="top"><div>⚡ SUNSET STREET RACER 3D</div><div id="status">ESCAPE THE CITY</div></div><div class="mission"><b>ROOFTOP RUN</b><br><small id="missionText">Reach the rooftop garage • Drift to build heat</small></div><div class="stats"><span id="dist">0.0</span> KM • <span id="fps">60</span> FPS</div><div class="heat">HEAT <span id="stars">★☆☆☆☆</span></div><div class="speed"><span id="spd">0</span> <small>KM/H</small></div><canvas class="mini" id="map" width="150" height="105"></canvas><div class="controls"><button class="btn drift" id="drift">DR</button><button class="btn gas" id="gas">▲</button><button class="btn left" id="left">◀</button><button class="btn brake" id="brake">▼</button><button class="btn right" id="right">▶</button></div><div class="hint">W/↑ GAS • S/↓ BRAKE • A/D STEER • SPACE DRIFT • R RESET</div><div class="banner" id="banner">ROOFTOP REACHED<br><small style="font-size:15px">CITY ESCAPE COMPLETE</small></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x87505a,55,380);scene.background=new THREE.Color(0x87505a);const camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,800);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('game').appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xffd0a8,0x18202d,2.1);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffb070,4);sun.position.set(-80,120,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);const moon=new THREE.DirectionalLight(0x6688ff,0);moon.position.set(80,100,-100);scene.add(moon);const world=new THREE.Group();scene.add(world);const M=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const road=M(0x25272c,.95),side=M(0x4a4d52,.9),line=M(0xf5f2dc,.6),glass=new THREE.MeshStandardMaterial({color:0x082030,roughness:.08,metalness:.4,transparent:true,opacity:.88});function box(w,h,d,ma,x,y,z){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;world.add(q);return q}
box(44,.2,760,road,0,.1,80);box(3,.25,760,side,-24,.22,80);box(3,.25,760,side,24,.22,80);for(let z=-280;z<440;z+=12)for(const x of[-11,0,11])box(.18,.03,6,line,x,.22,z);for(let i=-18;i<=18;i++){const z=i*20;for(const s of[-1,1]){for(let j=0;j<3;j++){const h=12+((i*17+j*31)%24+24)%24,w=5+((j*7+i)%4+4)%4,b=box(w,h,14,M([0x202733,0x303642,0x3b3340,0x252d35][(i+j+40)%4],.9),s*(29+j*6),h/2,z+j*3-3);for(let y=4;y<h-2;y+=4)for(let xx=-w/2+1;xx<w/2-1;xx+=2.2)box(.75,.9,.08,M(0xffd27a,.35),b.position.x+xx,y,b.position.z-7.05)}}}for(let z=-280;z<420;z+=35)for(const x of[-27,27]){box(.18,8,.18,M(0x17191d,.45,.7),x,4,z);box(1,.18,1,M(0xffe5a0,.2),x,8,z)}const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(22,32,16),new THREE.MeshBasicMaterial({color:0xffc46b}));sunDisc.position.set(-130,85,-260);scene.add(sunDisc);
const player=new THREE.Group();scene.add(player);player.position.set(0,.75,22);const body=new THREE.Mesh(new THREE.BoxGeometry(3.8,.75,7.3),M(0xe9edf4,.24,.75));body.position.y=.7;body.castShadow=true;player.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(3.35,.28,2.7),M(0xbfc6d2,.22,.8));hood.position.set(0,1.18,-1.55);player.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.65,.75,2.6),glass);cabin.position.set(0,1.43,1);player.add(cabin);for(const x of[-1.7,1.7])for(const z of[-2.35,2.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.36,24),M(0x08090b,.7,.4));w.rotation.z=Math.PI/2;w.position.set(x,.48,z);player.add(w)}const head=M(0xffffdd,.2,0);head.emissive=new THREE.Color(0xffd88a);head.emissiveIntensity=5;for(const x of[-1.25,1.25]){const l=new THREE.Mesh(new THREE.BoxGeometry(.65,.22,.12),head);l.position.set(x,1.02,-3.72);player.add(l)}
const traffic=[],colors=[0x4d8cff,0xd43c3c,0xf2d04b,0x48b889,0xb85ce8,0xffffff];function makeTraffic(i){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(3.1,.7,5.6),M(colors[i%colors.length],.35,.45));b.position.y=.7;g.add(b);const cg=new THREE.Mesh(new THREE.BoxGeometry(2.35,.65,2),glass);cg.position.set(0,1.25,.35);g.add(cg);for(const x of[-1.35,1.35])for(const z of[-1.8,1.8]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.3,20),M(0x090a0c,.7,.3));w.rotation.z=Math.PI/2;w.position.set(x,.48,z);g.add(w)}g.position.set([-11,0,11][i%3],.2,-35-i*42);world.add(g);traffic.push({g,lane:g.position.x,speed:45+(i%5)*10,hit:false})}for(let i=0;i<22;i++)makeTraffic(i);box(42,.5,32,M(0x5d6269,.75),0,.7,-330);for(let x=-18;x<=18;x+=6)box(4,.18,1,line,x,1.02,-330);
const smoke=[];function particle(){const s=new THREE.Mesh(new THREE.SphereGeometry(.12+Math.random()*.22,8,8),new THREE.MeshBasicMaterial({color:0xdde2e8,transparent:true,opacity:.38}));s.position.set(player.position.x+(Math.random()-.5)*2,.25,player.position.z+2.8+Math.random()*1.5);world.add(s);smoke.push({s,life:1})}const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);for(const id of['left','right','gas','brake','drift']){const b=document.getElementById(id),k={left:'a',right:'d',gas:'w',brake:'s',drift:' '}[id];b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>keys[k]=false}
let speed=0,steer=0,distance=0,heat=1,completed=false,last=performance.now();function reset(){player.position.set(0,.75,22);player.rotation.set(0,0,0);speed=steer=distance=0;heat=1;completed=false;traffic.forEach((q,i)=>{q.g.position.set([-11,0,11][i%3],.2,-35-i*42);q.lane=q.g.position.x})}function update(dt){const gas=keys.w||keys.arrowup,brake=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,drift=keys[' '];if(gas)speed+=90*dt;else speed-=22*dt;if(brake)speed-=130*dt;speed=THREE.MathUtils.clamp(speed,0,205);const target=(left?-1:0)+(right?1:0);steer=THREE.MathUtils.lerp(steer,target*1.9,dt*7);player.position.x=THREE.MathUtils.clamp(player.position.x+steer*dt*(speed/80),-18,18);player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-steer*.09,dt*8);if(drift&&Math.abs(steer)>.1&&speed>45){speed*=1-dt*.12;heat=Math.min(5,heat+dt*.22);particle();particle()}else heat=Math.max(1,heat-dt*.018);distance+=speed*dt*.0017;for(const q of traffic){q.g.position.z+=(speed-q.speed)*dt*.42;if(q.g.position.z>55){q.g.position.z=-720-Math.random()*100;q.lane=[-11,0,11][Math.floor(Math.random()*3)];q.g.position.x=q.lane;q.speed=40+Math.random()*70}if(Math.abs(q.g.position.z-player.position.z)<4.4&&Math.abs(q.g.position.x-player.position.x)<3.1){speed*=.25;heat=Math.min(5,heat+.7)}}for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.life-=dt*1.4;p.s.position.y+=dt*.6;p.s.scale.multiplyScalar(1+dt*1.5);p.s.material.opacity=p.life*.32;if(p.life<=0){world.remove(p.s);smoke.splice(i,1)}}const night=(Math.sin(performance.now()*.000025)+1)/2;sun.intensity=4*(1-night*.7);moon.intensity=night*1.2;scene.fog.color.setHSL(.98,.28,.38-night*.12);scene.background.copy(scene.fog.color);camera.position.lerp(new THREE.Vector3(player.position.x*.45,5.5,player.position.z+13),dt*4);camera.lookAt(player.position.x*.25,1.1,player.position.z-10);if(distance>=.52&&!completed){completed=true;document.getElementById('status').textContent='ROOFTOP REACHED';document.getElementById('missionText').textContent='Mission complete • Press R to replay';document.getElementById('banner').className='banner show'}}function mini(){const c=document.getElementById('map').getContext('2d');c.clearRect(0,0,150,105);c.fillStyle='#080b12';c.fillRect(0,0,150,105);c.strokeStyle='#777';c.lineWidth=7;c.beginPath();c.moveTo(75,100);c.lineTo(75,65);c.lineTo(58,40);c.lineTo(90,18);c.lineTo(75,5);c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(75,98-Math.min(88,distance*160),4,0,7);c.fill();c.fillStyle='#ff4545';c.fillRect(70,6,10,4)}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);document.getElementById('spd').textContent=Math.round(speed);document.getElementById('dist').textContent=distance.toFixed(2);const h=Math.min(5,Math.ceil(heat));document.getElementById('stars').textContent='★'.repeat(h)+'☆'.repeat(5-h);document.getElementById('fps').textContent=Math.round(1/dt);mini();requestAnimationFrame(loop)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop(performance.now());
</script></body></html>
