<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunset Street Racer</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#090b12;font-family:Arial;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:18px;font-weight:800;text-shadow:0 2px 4px #000}.speed{position:absolute;left:20px;bottom:22px;font-size:34px}.mission{position:absolute;top:65px;left:20px;background:#0008;padding:10px 14px;border-left:4px solid #fff}.heat{position:absolute;right:20px;top:70px}.mini{position:absolute;right:20px;bottom:20px;width:120px;height:90px;border:2px solid #fff8;background:#111a;border-radius:8px}.controls{position:absolute;bottom:18px;right:160px;display:flex;gap:8px;pointer-events:auto}.btn{width:58px;height:58px;border-radius:50%;border:1px solid #fff8;background:#ffffff25;color:#fff;font-size:22px}.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);opacity:.7;font-size:12px}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div>SUNSET STREET RACER</div><div id="status">ESCAPE THE CITY</div></div><div class="mission">MISSION: Reach the rooftop parking area<br><small>Drift, dodge traffic and lose the heat.</small></div><div class="heat">HEAT <span id="stars">★☆☆☆☆</span></div><div class="speed"><span id="spd">0</span> KM/H</div><canvas class="mini" id="map" width="120" height="90"></canvas><div class="controls"><button class="btn" id="left">◀</button><button class="btn" id="gas">▲</button><button class="btn" id="brake">▼</button><button class="btn" id="right">▶</button></div><div class="hint">Keyboard: W/↑ accelerate · S/↓ brake · A/D steer · Space drift</div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),m=document.getElementById('map').getContext('2d');let W,H;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);for(const id of ['left','right','gas','brake']){let b=document.getElementById(id),k={left:'a',right:'d',gas:'w',brake:'s'}[id];b.onpointerdown=()=>keys[k]=1;b.onpointerup=b.onpointercancel=()=>keys[k]=0}
let car={px:0,lane:0,v:0,heat:1,dist:0,drift:0};let traffic=[];for(let i=0;i<18;i++)traffic.push({z:i*180+300,l:(Math.random()*3|0)-1,s:30+Math.random()*35});let t=0;
function road(){let horizon=H*.34;let grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#f28a5a');grad.addColorStop(.35,'#7a3f52');grad.addColorStop(1,'#10141c');x.fillStyle=grad;x.fillRect(0,0,W,H);for(let i=0;i<24;i++){let bx=(i*83+17)%W,bh=60+((i*47)%170);x.fillStyle=i%3?'#202a35':'#34343d';x.fillRect(bx,horizon-bh,60,bh);x.fillStyle='#ffd98a';for(let yy=horizon-bh+12;yy<horizon-8;yy+=18)x.fillRect(bx+10,yy,5,5);}
let curve=Math.sin(t*.0007)*70; x.fillStyle='#25282d';x.beginPath();x.moveTo(W*.34,horizon);x.lineTo(W*.66,horizon);x.lineTo(W*.96,H);x.lineTo(W*.04,H);x.closePath();x.fill();x.strokeStyle='#aaa';x.lineWidth=2;x.setLineDash([35,28]);for(let a of [-.11,.11]){x.beginPath();x.moveTo(W*(.5+a),horizon);x.lineTo(W*(.5+a*7),H);x.stroke()}x.setLineDash([]);}
function drawCar(cx,cy,scale,enemy=false){x.save();x.translate(cx,cy);x.scale(scale,scale);x.fillStyle=enemy?'#b83232':'#e9e9ee';x.beginPath();x.moveTo(-28,32);x.lineTo(-23,-5);x.lineTo(-13,-25);x.lineTo(13,-25);x.lineTo(23,-5);x.lineTo(28,32);x.closePath();x.fill();x.fillStyle='#111a25';x.fillRect(-15,-18,30,15);x.fillStyle=enemy?'#ffb0a0':'#9fe8ff';x.fillRect(-12,-15,24,9);x.fillStyle='#111';x.fillRect(-29,15,8,15);x.fillRect(21,15,8,15);x.fillStyle='#fff';x.fillRect(-20,24,7,4);x.fillRect(13,24,7,4);x.restore()}
function loop(){t+=16;road();let steer=(keys['a']||keys['arrowleft']?-1:0)+(keys['d']||keys['arrowright']?1:0);let gas=keys['w']||keys['arrowup'];let brake=keys['s']||keys['arrowdown'];car.v+=gas?1.1:-.35;if(brake)car.v-=1.6;car.v=Math.max(0,Math.min(190,car.v));car.lane+=steer*.035*(car.v/80);car.lane=Math.max(-1.5,Math.min(1.5,car.lane));if(keys[' ']){car.drift=Math.min(100,car.drift+2);car.v*=.992}else car.drift*=.94;car.dist+=car.v*.018;car.heat=Math.min(5,1+car.dist/1000+Math.abs(steer)*.6);
traffic.forEach(q=>{q.z-=car.v*.045;q.z<80&&(q.z+=3200,q.l=(Math.random()*3|0)-1);let y=H*.34+(H*.58)*(1-q.z/3200),s=.2+.9*(1-q.z/3200);if(q.z>80&&q.z<3200)drawCar(W/2+(q.l-car.lane)*W*.15*s,y,s,q.l!==0);});drawCar(W/2+car.lane*W*.15,H*.82,1.35);if(car.drift>15){x.fillStyle='#ffffff55';for(let i=0;i<8;i++){x.beginPath();x.arc(W/2+(Math.random()-.5)*90,H*.88+Math.random()*25,4+Math.random()*8,0,7);x.fill()}}
document.getElementById('spd').textContent=Math.round(car.v);document.getElementById('stars').textContent='★'.repeat(Math.min(5,Math.ceil(car.heat)))+'☆'.repeat(5-Math.min(5,Math.ceil(car.heat)));document.getElementById('status').textContent=car.dist>2500?'ROOFTOP REACHED':'ESCAPE THE CITY';m.clearRect(0,0,120,90);m.fillStyle='#151922';m.fillRect(0,0,120,90);m.strokeStyle='#ddd';m.lineWidth=4;m.beginPath();m.moveTo(10,80);m.lineTo(35,60);m.lineTo(48,30);m.lineTo(80,15);m.lineTo(108,8);m.stroke();m.fillStyle='#fff';m.beginPath();m.arc(10+Math.min(98,car.dist/2500*98),80-car.dist/2500*72,4,0,7);m.fill();requestAnimationFrame(loop)}loop();
</script></body></html>
